<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Search</title>

  <style>
    :root {
      --bg: #fafaf9;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --border: #e7e5e4;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --error: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input,
    select,
    button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    input {
      flex: 1 1 180px;
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      min-height: 1.5em;
      margin: 16px 0;
      color: var(--muted);
    }

    #message.error {
      color: var(--error);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .condition {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .temp {
      margin: 8px 0 16px;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    .details {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
      color: var(--muted);
    }

    .details strong {
      color: var(--text);
    }

    footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Weather Search</h1>
    <p class="subtitle">Type a city to see its current weather.</p>

    <form id="searchForm">
      <input type="text" id="cityInput" placeholder="e.g. Seattle" autocomplete="off" required aria-label="City name">
      <select id="unitSelect" aria-label="Units">
        <option value="imperial">&deg;F / mph</option>
        <option value="metric">&deg;C / km/h</option>
      </select>
      <button type="submit" id="searchButton">Search</button>
    </form>

    <p id="message" role="status"></p>

    <section id="result" class="card" hidden>
      <h2 id="placeName"></h2>
      <p id="condition" class="condition"></p>
      <p id="temperature" class="temp"></p>
      <ul class="details">
        <li>Feels like <strong id="feelsLike"></strong></li>
        <li>Humidity <strong id="humidity"></strong></li>
        <li>Wind <strong id="wind"></strong></li>
      </ul>
    </section>

    <footer>
      Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>
    </footer>
  </main>

  <script>
    // Grab the page elements we need to work with
    const searchForm = document.getElementById("searchForm")
    const cityInput = document.getElementById("cityInput")
    const unitSelect = document.getElementById("unitSelect")
    const searchButton = document.getElementById("searchButton")
    const message = document.getElementById("message")
    const result = document.getElementById("result")
    const placeName = document.getElementById("placeName")
    const condition = document.getElementById("condition")
    const temperature = document.getElementById("temperature")
    const feelsLike = document.getElementById("feelsLike")
    const humidity = document.getElementById("humidity")
    const wind = document.getElementById("wind")

    // The weather service sends a number (a "WMO code") for the conditions.
    // This object translates each number into words we can show.
    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear",
      2: "Partly cloudy",
      3: "Overcast",
      45: "Fog",
      48: "Freezing fog",
      51: "Light drizzle",
      53: "Drizzle",
      55: "Heavy drizzle",
      56: "Light freezing drizzle",
      57: "Freezing drizzle",
      61: "Light rain",
      63: "Rain",
      65: "Heavy rain",
      66: "Light freezing rain",
      67: "Freezing rain",
      71: "Light snow",
      73: "Snow",
      75: "Heavy snow",
      77: "Snow grains",
      80: "Light rain showers",
      81: "Rain showers",
      82: "Heavy rain showers",
      85: "Light snow showers",
      86: "Heavy snow showers",
      95: "Thunderstorm",
      96: "Thunderstorm with hail",
      99: "Thunderstorm with heavy hail"
    }

    function describeWeather(code) {
      return weatherCodes[code] || "Conditions unavailable"
    }

    function showMessage(text, isError) {
      message.textContent = text
      message.className = isError ? "error" : ""
    }

    // Step 1: turn a city name into coordinates (latitude and longitude)
    async function findCity(name) {
      const url =
        "https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(name) +
        "&count=1&language=en&format=json"

      const response = await fetch(url)
      if (!response.ok) {
        throw new Error("City search failed")
      }

      const data = await response.json()

      // If nothing matches, the answer may have no "results" list at all
      if (!data.results || data.results.length === 0) {
        return null
      }
      return data.results[0]
    }

    // Step 2: ask for the current weather at those coordinates
    async function getWeather(place, units) {
      const temperatureUnit = units === "imperial" ? "fahrenheit" : "celsius"
      const windUnit = units === "imperial" ? "mph" : "kmh"

      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + place.latitude +
        "&longitude=" + place.longitude +
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
        "&temperature_unit=" + temperatureUnit +
        "&wind_speed_unit=" + windUnit

      const response = await fetch(url)
      if (!response.ok) {
        throw new Error("Weather request failed")
      }
      return await response.json()
    }

    // Put the results on the page
    function showWeather(place, weather) {
      const current = weather.current
      const units = weather.current_units

      // Build a label like "Seattle, Washington, United States"
      const label = [place.name, place.admin1, place.country]
        .filter(Boolean)
        .join(", ")

      placeName.textContent = label
      condition.textContent = describeWeather(current.weather_code)
      temperature.textContent = Math.round(current.temperature_2m) + units.temperature_2m
      feelsLike.textContent = Math.round(current.apparent_temperature) + units.apparent_temperature
      humidity.textContent = current.relative_humidity_2m + units.relative_humidity_2m
      wind.textContent = Math.round(current.wind_speed_10m) + " " + units.wind_speed_10m

      result.hidden = false
    }

    // Runs when the visitor presses Search or hits Enter
    searchForm.addEventListener("submit", async function(event) {
      event.preventDefault()

      const cityName = cityInput.value.trim()
      if (cityName === "") {
        return
      }

      searchButton.disabled = true
      result.hidden = true
      showMessage("Searching...", false)

      try {
        const place = await findCity(cityName)

        if (place === null) {
          showMessage("No city found called \"" + cityName + "\". Check the spelling and try again.", true)
          return
        }

        const weather = await getWeather(place, unitSelect.value)
        showMessage("", false)
        showWeather(place, weather)
      } catch (error) {
        showMessage("Something went wrong. Check your internet connection and try again.", true)
      } finally {
        searchButton.disabled = false
      }
    })
  </script>
</body>
</html>
